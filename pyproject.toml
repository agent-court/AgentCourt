[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcourt"
version = "0.4.0"
authors = [
  { name = "AgentCourt Core Team" }
]
description = "Multi-agent synthetic arbitration and escrow protocol client for autonomous AI commerce."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "web3>=6.0.0",
    "chromadb>=0.4.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "python-dotenv>=1.0.0",
    "certifi>=2024.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentcourt*"]
