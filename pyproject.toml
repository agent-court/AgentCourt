[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcourt"
version = "0.1.0"
authors = [
  { name = "Polybius Labs", email = "contact@polybiuslabs.xyz" },
]
description = "Trust-minimized multi-agent neural dispute arbitration protocol on Base."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "web3>=6.0.0",
    "chromadb>=0.4.0",
    "onnxruntime",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-generativeai",
    "python-dotenv"
]

[tool.setuptools.packages.find]
include = ["agentcourt*"]
exclude = ["node_modules*", "cache*", "artifacts*", "contracts*", "sdk*", "chroma_db*", "agentcourt_db*"]

[tool.setuptools.package-data]
agentcourt = ["*.json"]
