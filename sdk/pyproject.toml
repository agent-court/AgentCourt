[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcourt"
version = "0.1.0"
description = "Python SDK for AgentCourt Autonomous AI Dispute Resolution on Base"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "web3>=6.0.0",
    "python-dotenv>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/agent-court/AgentCourt"
